<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>오사카 3박4일 지도 · 로컬 맛집 & 관광지</title>
<style>
:root{
  --paper:#F2F4F7; --surface:#FFF; --surface2:#E9ECF1; --sheet:#FFF;
  --ink:#161A21; --ink2:#4C525E; --ink3:#7C838F; --line:#DCE0E7;
  --accent:#D2402E; --c-spot:#26688F; --c-local:#D2402E; --c-tourist:#9C6B12;
  --c-hotel:#1E2430; --warn:#9A4A14; --warnbg:#FBEDE2;
  --mapfx:saturate(1);
  --shadow:0 1px 2px rgba(16,20,28,.08),0 8px 24px -8px rgba(16,20,28,.18);
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Noto Sans KR","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0C0F14; --surface:#161A21; --surface2:#1E232C; --sheet:#141821;
  --ink:#E8EBF0; --ink2:#A9B0BC; --ink3:#767D8A; --line:#272D37;
  --accent:#FF6E58; --c-spot:#63AAD6; --c-local:#FF6E58; --c-tourist:#D9A23F;
  --c-hotel:#C9D1DD; --warn:#E0A76F; --warnbg:#2A2118;
  --mapfx:invert(1) hue-rotate(180deg) brightness(.99) contrast(.85) saturate(.75);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -8px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --paper:#0C0F14; --surface:#161A21; --surface2:#1E232C; --sheet:#141821;
  --ink:#E8EBF0; --ink2:#A9B0BC; --ink3:#767D8A; --line:#272D37;
  --accent:#FF6E58; --c-spot:#63AAD6; --c-local:#FF6E58; --c-tourist:#D9A23F;
  --c-hotel:#C9D1DD; --warn:#E0A76F; --warnbg:#2A2118;
  --mapfx:invert(1) hue-rotate(180deg) brightness(.99) contrast(.85) saturate(.75);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -8px rgba(0,0,0,.6);
}
:root[data-theme="light"]{
  --paper:#F2F4F7; --surface:#FFF; --surface2:#E9ECF1; --sheet:#FFF;
  --ink:#161A21; --ink2:#4C525E; --ink3:#7C838F; --line:#DCE0E7;
  --accent:#D2402E; --c-spot:#26688F; --c-local:#D2402E; --c-tourist:#9C6B12;
  --c-hotel:#1E2430; --warn:#9A4A14; --warnbg:#FBEDE2;
  --mapfx:saturate(1);
  --shadow:0 1px 2px rgba(16,20,28,.08),0 8px 24px -8px rgba(16,20,28,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---------- 상단 바 ---------- */
#top{position:absolute;top:0;left:0;right:0;z-index:40;padding:calc(env(safe-area-inset-top) + 8px) 10px 0;
  pointer-events:none;display:flex;flex-direction:column;gap:7px}
.bar{pointer-events:auto;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow)}
#hdr{display:flex;align-items:center;gap:9px;padding:9px 11px}
#hdr h1{margin:0;font-size:14px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
#hdr .sub{font-family:var(--mono);font-size:10.5px;color:var(--ink3);letter-spacing:-.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
#themeBtn{font-size:15px;line-height:1;padding:4px;border-radius:7px;flex:none}
#themeBtn:hover{background:var(--surface2)}

#q{width:100%;padding:9px 11px;border:0;background:none;color:var(--ink);font-size:14px;border-radius:12px}
#q::placeholder{color:var(--ink3)}

#chips{display:flex;gap:6px;overflow-x:auto;padding:1px 1px 2px;scrollbar-width:none;pointer-events:auto}
#chips::-webkit-scrollbar{display:none}
.chip{pointer-events:auto;flex:none;display:inline-flex;align-items:center;gap:5px;
  padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-size:12px;font-weight:600;letter-spacing:-.01em;box-shadow:var(--shadow);color:var(--ink2);
  transition:background .12s,color .12s,border-color .12s}
.chip .dot{width:8px;height:8px;border-radius:50%;flex:none}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.on.cat-spot{background:var(--c-spot);border-color:var(--c-spot);color:#fff}
.chip.on.cat-local{background:var(--c-local);border-color:var(--c-local);color:#fff}
.chip.on.cat-tourist{background:var(--c-tourist);border-color:var(--c-tourist);color:#fff}
.chip .n{font-family:var(--mono);font-size:10px;opacity:.75;font-variant-numeric:tabular-nums}

/* ---------- 지도 ---------- */
#map{position:absolute;inset:0;overflow:hidden;background:var(--surface2);touch-action:none;cursor:grab}
#map.drag{cursor:grabbing}
#tiles{position:absolute;inset:0;filter:var(--mapfx);will-change:transform}
#tiles div{position:absolute;width:256px;height:256px;background-size:100% 100%;
  background-repeat:no-repeat;transform-origin:0 0}
#pins{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;pointer-events:auto;transform:translate(-50%,-100%);
  display:flex;flex-direction:column;align-items:center;cursor:pointer}
.pin .head{width:19px;height:19px;border-radius:50% 50% 50% 2px;transform:rotate(45deg);
  border:2px solid var(--surface);box-shadow:0 2px 5px rgba(0,0,0,.35)}
.pin .lbl{margin-top:3px;font-size:10.5px;font-weight:700;letter-spacing:-.02em;
  background:var(--surface);color:var(--ink);padding:1px 5px;border-radius:5px;
  border:1px solid var(--line);white-space:nowrap;max-width:112px;overflow:hidden;
  text-overflow:ellipsis;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.pin.sel{z-index:20}
.pin.sel .head{width:25px;height:25px;box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 28%,transparent),0 3px 7px rgba(0,0,0,.4)}
.pin.fav .head::after{content:"";position:absolute;inset:0;border-radius:inherit;
  box-shadow:inset 0 0 0 2px #fff}
.cluster{position:absolute;pointer-events:auto;transform:translate(-50%,-50%);
  min-width:34px;height:34px;padding:0 7px;border-radius:999px;background:var(--surface);
  border:2px solid var(--ink);color:var(--ink);display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;
  box-shadow:var(--shadow);cursor:pointer}
#hotelPin .head{border-radius:4px;background:var(--c-hotel)}

#zoomers{position:absolute;right:10px;bottom:calc(env(safe-area-inset-bottom) + 118px);z-index:30;
  display:flex;flex-direction:column;gap:1px;border-radius:11px;overflow:hidden;box-shadow:var(--shadow)}
#zoomers button{width:38px;height:38px;background:var(--surface);font-size:17px;font-weight:600;
  display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line)}
#zoomers button:last-child{border-bottom:0;font-size:14px}
#attrib{position:absolute;left:0;bottom:calc(env(safe-area-inset-bottom) + 62px);z-index:12;
  font-size:9px;color:var(--ink3);background:color-mix(in srgb,var(--paper) 78%,transparent);
  padding:2px 6px;border-radius:0 5px 0 0;letter-spacing:-.01em}

/* ---------- 목록 / 일정 ---------- */
#list,#plan{position:absolute;inset:0;top:0;overflow-y:auto;background:var(--paper);
  padding:calc(env(safe-area-inset-top) + 144px) 12px calc(env(safe-area-inset-bottom) + 78px);
  -webkit-overflow-scrolling:touch}
#plan{padding-top:calc(env(safe-area-inset-top) + 64px)}
.row{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:11px 12px;margin-bottom:7px}
.row:active{background:var(--surface2)}
.row .stripe{width:3px;align-self:stretch;border-radius:2px;flex:none}
.row .body{flex:1;min-width:0}
.row .t{font-weight:700;font-size:14.5px;letter-spacing:-.02em;display:flex;align-items:center;gap:5px}
.row .ja{font-size:11px;color:var(--ink3);margin-top:1px}
.row .meta{font-family:var(--mono);font-size:10.5px;color:var(--ink2);margin-top:5px;
  display:flex;flex-wrap:wrap;gap:7px;font-variant-numeric:tabular-nums}
.row .d{font-size:12.5px;color:var(--ink2);margin-top:6px;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mins{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink);
  background:var(--surface2);padding:3px 6px;border-radius:6px;flex:none;
  font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.walkTag{color:var(--c-local);font-weight:700}
.closedTag{color:var(--warn);font-weight:700}
#empty{text-align:center;color:var(--ink3);font-size:13px;padding:44px 20px;line-height:1.7}

.secTitle{font-size:11px;font-weight:800;letter-spacing:.09em;color:var(--ink3);
  text-transform:uppercase;margin:20px 2px 9px}
.secTitle:first-child{margin-top:0}
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:14px 14px 4px;margin-bottom:12px}
.day h3{margin:0 0 3px;font-size:15.5px;font-weight:800;letter-spacing:-.02em}
.day .when{font-size:11.5px;color:var(--accent);font-weight:700;margin-bottom:11px;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.step{display:flex;gap:11px;padding-bottom:14px;position:relative}
.step::before{content:"";position:absolute;left:35px;top:17px;bottom:-1px;width:1px;background:var(--line)}
.step:last-child::before{display:none}
.step .tm{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink3);
  width:38px;flex:none;padding-top:2px;font-variant-numeric:tabular-nums}
.step .kn{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none;margin-top:5px;
  box-shadow:0 0 0 3px var(--surface);z-index:1}
.step.key .kn{background:var(--accent)}
.step .txt{flex:1;min-width:0;font-size:13.5px;line-height:1.5}
.step .txt b{font-weight:700}
.step .note{font-size:12px;color:var(--ink2);margin-top:3px;line-height:1.55}
.step .go{display:inline-block;margin-top:5px;font-size:11.5px;font-weight:700;color:var(--accent);
  border-bottom:1px solid color-mix(in srgb,var(--accent) 40%,transparent);padding-bottom:1px;cursor:pointer}
.callout{background:var(--warnbg);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);
  border-radius:11px;padding:11px 12px;font-size:12.5px;line-height:1.6;color:var(--ink);margin-bottom:12px}
.callout b{color:var(--warn)}
table.rev{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px;
  font-variant-numeric:tabular-nums;margin-top:8px}
table.rev th,table.rev td{padding:5px 7px;border-bottom:1px solid var(--line);text-align:left}
table.rev th{color:var(--ink3);font-weight:700;font-size:10px;letter-spacing:.05em}

/* ---------- 상세 시트 ---------- */
#scrim{position:fixed;inset:0;z-index:60;background:rgba(8,10,14,.42);opacity:0;
  pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--sheet);
  border-radius:19px 19px 0 0;box-shadow:0 -8px 34px rgba(0,0,0,.28);
  transform:translateY(103%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  max-height:88vh;display:flex;flex-direction:column;touch-action:pan-y}
#sheet.on{transform:translateY(0)}
#grab{padding:9px 0 3px;display:flex;justify-content:center;flex:none;cursor:grab}
#grab i{width:36px;height:4px;border-radius:2px;background:var(--line);display:block}
#sheetBody{overflow-y:auto;padding:4px 17px calc(env(safe-area-inset-bottom) + 17px);
  -webkit-overflow-scrolling:touch}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.badge{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;
  border:1px solid var(--line);color:var(--ink2);letter-spacing:-.01em}
.badge.cat{color:#fff;border:0}
#sheetBody h2{margin:0 0 2px;font-size:21px;font-weight:800;letter-spacing:-.03em;text-wrap:balance}
.jaName{display:flex;align-items:center;gap:7px;margin-bottom:13px;flex-wrap:wrap}
.jaName span{font-size:13px;color:var(--ink2)}
.jaName button{font-size:10.5px;font-weight:700;color:var(--accent);border:1px solid
  color-mix(in srgb,var(--accent) 35%,transparent);padding:2px 7px;border-radius:6px}
.desc{font-size:14px;line-height:1.62;color:var(--ink);margin-bottom:14px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 13px;font-size:13px;
  padding:13px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:13px}
.facts dt{color:var(--ink3);font-size:11.5px;font-weight:700;padding-top:1px;white-space:nowrap}
.facts dd{margin:0;line-height:1.5}
.facts dd.m{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.warnBox{background:var(--warnbg);border-radius:10px;padding:10px 12px;font-size:12.5px;
  line-height:1.55;margin-bottom:13px;border:1px solid color-mix(in srgb,var(--warn) 28%,transparent)}
.warnBox b{color:var(--warn)}
.acts{display:flex;gap:8px}
.acts a,.acts button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  padding:12px 8px;border-radius:11px;font-size:13.5px;font-weight:700;text-decoration:none;
  background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.acts a.pri,.acts button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.acts button.favOn{background:var(--accent);color:#fff;border-color:var(--accent)}
.acts #favBtn2{flex:0 0 52px}
.peekTop{display:flex;align-items:flex-start;gap:10px}
.peekTop h2{margin:0}
.peekLine{font-size:13px;line-height:1.55;color:var(--ink2);padding:3px 0}
.peekLine b{color:var(--ink3);font-size:11.5px;font-weight:700;margin-right:7px}

/* ---------- 일정: 모드 · 시간대 옵션 ---------- */
.modeBar{display:flex;gap:6px;background:var(--surface2);padding:4px;border-radius:12px;margin-bottom:10px}
.modeBar button{flex:1;padding:9px 6px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--ink3)}
.modeBar button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.modeDesc{font-size:12px;color:var(--ink2);line-height:1.55;margin:0 2px 14px}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:7px}
.opt{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;padding:9px 10px;
  border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:12.5px;line-height:1.5}
.opt.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.opt .mk{width:15px;height:15px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:2px}
.opt.on .mk{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 2.5px var(--surface)}
.opt .on1{display:block;font-weight:700;color:var(--ink)}
.opt .on2{display:block;color:var(--ink2);margin-top:3px;font-size:12px;line-height:1.5}
.envTag{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:999px;margin-left:5px;
  border:1px solid var(--line);color:var(--ink3);white-space:nowrap}
.envTag.out{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.heatRow{display:flex;gap:7px;align-items:center;font-size:11.5px;color:var(--warn);
  font-weight:700;margin:-4px 2px 12px}

/* ---------- 하단 탭 ---------- */
#tabs{position:absolute;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:10.5px;font-weight:700;color:var(--ink3);letter-spacing:-.01em}
#tabs button .ic{font-size:17px;line-height:1.1}
#tabs button.on{color:var(--accent)}
.hide{display:none!important}
</style>

<div id="app">
  <div id="map"><div id="tiles"></div><div id="pins"></div></div>

  </nav>
</div>

<script>
const T=__TILES__, P=__DATA__;
const TZ=[10,13,14,15], HOTEL=P.find(p=>p.cat==="hotel");
const CATN={spot:"관광지",local:"로컬 맛집",tourist:"한국인 맛집",hotel:"숙소"};
const CATC={spot:"var(--c-spot)",local:"var(--c-local)",tourist:"var(--c-tourist)",hotel:"var(--c-hotel)"};

/* ===== 상태 ===== */
const LS="osaka2607";
let S={cats:{spot:1,local:1,tourist:1},maxMin:90,day:"any",fav:0,q:"",view:"map",sel:null,shade:0};
const ENVN={in:"실내",cov:"지붕·아케이드",out:"실외"};
const ENVI={in:"❄",cov:"⛱",out:"☀"};
let fav=new Set(JSON.parse(localStorage.getItem(LS+"f")||"[]"));
let theme=localStorage.getItem(LS+"t")||"";
if(theme)document.documentElement.dataset.theme=theme;

/* ===== 지도 수학 ===== */
const map=document.getElementById("map"),tilesEl=document.getElementById("tiles"),pinsEl=document.getElementById("pins");
let cam={lat:HOTEL.lat,lng:HOTEL.lng,z:14.2},CL=[];
const MINZ=9.6,MAXZ=17.2;
const lon2x=(l,z)=>(l+180)/360*256*Math.pow(2,z);
const lat2y=(l,z)=>(1-Math.asinh(Math.tan(l*Math.PI/180))/Math.PI)/2*256*Math.pow(2,z);
const x2lon=(x,z)=>x/(256*Math.pow(2,z))*360-180;
const y2lat=(y,z)=>Math.atan(Math.sinh(Math.PI*(1-2*y/(256*Math.pow(2,z)))))*180/Math.PI;

// 해당 좌표에 타일이 없으면 상위 줌 타일을 잘라 쓴다
function tileURL(z,x,y){
  for(let k=0;k<=6;k++){
    const zz=z-k; if(zz<0)break;
    const key=zz+"/"+(x>>k)+"/"+(y>>k);
    if(T[key])return{key,k};
  }
  return null;
}
function pickTZ(z){let best=TZ[0];for(const t of TZ)if(t<=z+0.55)best=t;return best;}

function render(){
  const W=map.clientWidth,H=map.clientHeight,z=cam.z,tz=pickTZ(z);
  const sc=Math.pow(2,z-tz),ts=256*sc;
  const cx=lon2x(cam.lng,tz),cy=lat2y(cam.lat,tz);
  const ox=W/2-cx*sc, oy=H/2-cy*sc;
  const x0=Math.floor(-ox/ts),x1=Math.floor((W-ox)/ts);
  const y0=Math.floor(-oy/ts),y1=Math.floor((H-oy)/ts);
  const max=Math.pow(2,tz),frag=[];
  for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++){
    if(y<0||y>=max)continue;
    const xx=((x%max)+max)%max, u=tileURL(tz,xx,y); if(!u)continue;
    const sz=ts*Math.pow(2,u.k), sx=(xx%Math.pow(2,u.k))*ts, sy=(y%Math.pow(2,u.k))*ts;
    frag.push(`<div style="transform:translate(${ox+x*ts-sx}px,${oy+y*ts-sy}px);width:${sz}px;height:${sz}px;background-image:url(data:image/webp;base64,${T[u.key]})"></div>`);
  }
  tilesEl.innerHTML=frag.join("");

  // ---- 핀 (겹치면 묶음) ----
  const vis=filtered(),cell=48,grid=new Map(),out=[];
  const place=p=>({x:(lon2x(p.lng,tz)-cx)*sc+W/2, y:(lat2y(p.lat,tz)-cy)*sc+H/2});
  for(const p of vis){
    const s=place(p);
    if(s.x<-60||s.x>W+60||s.y<-60||s.y>H+60)continue;
    if(S.sel===p.id){out.push({solo:p,s});continue;}
    const k=Math.floor(s.x/cell)+"_"+Math.floor(s.y/cell);
    if(!grid.has(k))grid.set(k,[]); grid.get(k).push({p,s});
  }
  const html=[];
  const hs=place(HOTEL);
  if(hs.x>-40&&hs.x<W+40&&hs.y>-40&&hs.y<H+40)
    html.push(`<div class="pin" id="hotelPin" style="left:${hs.x}px;top:${hs.y}px" data-id="hotel"><div class="head"></div><div class="lbl">숙소</div></div>`);
  CL=[];
  for(const [,g] of grid){
    if(g.length===1){out.push({solo:g[0].p,s:g[0].s});continue;}
    const ax=g.reduce((a,b)=>a+b.s.x,0)/g.length, ay=g.reduce((a,b)=>a+b.s.y,0)/g.length;
    const cats=new Set(g.map(o=>o.p.cat)), col=cats.size===1?CATC[[...cats][0]]:"var(--ink)";
    const ci=CL.push({x:ax,y:ay,ids:g.map(o=>o.p.id)})-1;
    html.push(`<div class="cluster" style="left:${ax}px;top:${ay}px;border-color:${col};color:${col}" data-ci="${ci}">${g.length}</div>`);
  }
  // 라벨은 겹치지 않는 것만 — 선택 > 저장 > 가까운 순으로 자리를 먼저 차지
  out.sort((a,b)=>(S.sel===b.solo.id)-(S.sel===a.solo.id)
                ||(fav.has(b.solo.id)-fav.has(a.solo.id))
                ||a.solo.min-b.solo.min);
  const boxes=[];
  const free=(x0,y0,x1,y1)=>!boxes.some(b=>x0<b[2]&&x1>b[0]&&y0<b[3]&&y1>b[1]);
  for(const {solo:p,s} of out){
    let showLbl=false;
    if(z>=13.2||S.sel===p.id){
      const w=Math.min(112,p.ko.length*11.5+12), bx0=s.x-w/2, by0=s.y+3, bx1=s.x+w/2, by1=s.y+20;
      if(S.sel===p.id||free(bx0,by0,bx1,by1)){boxes.push([bx0,by0,bx1,by1]);showLbl=true;}
    }
    html.push(`<div class="pin ${S.sel===p.id?"sel":""} ${fav.has(p.id)?"fav":""}" style="left:${s.x}px;top:${s.y}px" data-id="${p.id}">
      <div class="head" style="background:${CATC[p.cat]}"></div>
      ${showLbl?`<div class="lbl">${esc(p.ko)}</div>`:""}</div>`);
  }
  pinsEl.innerHTML=html.join("");
}

function openOn(p){ return S.day==="sat"?p.sat!==false : S.day==="sun"?p.sun!==false : true; }
function filtered(){
  const q=S.q.trim().toLowerCase();
  return P.filter(p=>p.cat!=="hotel"
    && S.cats[p.cat]
    && p.min<=S.maxMin
    && openOn(p)
    && (!S.fav||fav.has(p.id))
    && (!S.shade||p.env!=="out")
    && (!q||[p.ko,p.ja,p.area,p.genre,p.must,p.desc].join(" ").toLowerCase().includes(q)));
}
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let ptrs=new Map(),last=null,pinchD=0;
map.addEventListener("pointerdown",e=>{
  map.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){last={x:e.clientX,y:e.clientY};map.classList.add("drag");}
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinchD=Math.hypot(a.x-b.x,a.y-b.y);}
});
map.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){
    const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinchD>0){cam.z=Math.max(MINZ,Math.min(MAXZ,cam.z+Math.log2(d/pinchD)));render();}
    pinchD=d; return;
  }
  if(!last)return;
  const dx=e.clientX-last.x,dy=e.clientY-last.y;
  const tz=pickTZ(cam.z),sc=Math.pow(2,cam.z-tz);
  cam.lng=x2lon(lon2x(cam.lng,tz)-dx/sc,tz); cam.lat=y2lat(lat2y(cam.lat,tz)-dy/sc,tz);
  cam.lat=Math.max(-85,Math.min(85,cam.lat)); last={x:e.clientX,y:e.clientY}; render();
});
const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinchD=0;if(!ptrs.size){last=null;map.classList.remove("drag");}};
map.addEventListener("pointerup",up); map.addEventListener("pointercancel",up);
map.addEventListener("wheel",e=>{
  e.preventDefault();
  const r=map.getBoundingClientRect(),mx=e.clientX-r.left-r.width/2,my=e.clientY-r.top-r.height/2;
  const tz=pickTZ(cam.z),sc=Math.pow(2,cam.z-tz);
  const bx=lon2x(cam.lng,tz)+mx/sc, by=lat2y(cam.lat,tz)+my/sc;
  cam.z=Math.max(MINZ,Math.min(MAXZ,cam.z-e.deltaY*(e.ctrlKey?.012:.0022)));
  const s2=Math.pow(2,cam.z-tz);
  cam.lng=x2lon(bx-mx/s2,tz); cam.lat=y2lat(by-my/s2,tz); render();
},{passive:false});

function renderPlan(){
  const days=PLAN.days[mode], m=PLAN.modes.find(x=>x.key===mode);
  let h=`<div class="modeBar">${PLAN.modes.map(x=>
      `<button class="${x.key===mode?"on":""}" data-mode="${x.key}">${x.label}</button>`).join("")}</div>
    <p class="modeDesc">${m.desc}</p>`;
  days.forEach((d,di)=>{
    h+=`<div class="day"><h3>${d.t}</h3><div class="when">${d.when}</div>`;
    if(d.callout)h+=`<div class="callout" style="margin:0 0 12px">${d.callout}</div>`;
    d.slots.forEach((s,si)=>{
      const key=mode+di+"_"+si, sel=pick[key]??0;
      h+=`<div class="step ${s.key?"key":""}"><span class="tm">${s.tm}</span><i class="kn"></i><div class="txt">
        <b>${s.title}</b>${s.env?`<span class="envTag ${s.env}">${ENVI[s.env]} ${ENVN[s.env]}</span>`:""}
        ${s.note?`<div class="note">${s.note}</div>`:""}`;
      if(s.opts){
        h+=`<div class="opts">`+s.opts.map((o,oi)=>`
          <button class="opt ${oi===sel?"on":""}" data-k="${key}" data-o="${oi}">
            <i class="mk"></i>
            <span style="flex:1;min-width:0">
              <span class="on1">${o.label}${o.env?`<span class="envTag ${o.env}">${ENVI[o.env]} ${ENVN[o.env]}</span>`:""}</span>
              ${o.note?`<span class="on2">${o.note}</span>`:""}
            </span>
            ${o.id?`<span class="go" data-go="${o.id}" style="margin:0;flex:none">지도</span>`:""}
          </button>`).join("")+`</div>`;
      }
      h+=`</div></div>`;
    });
    h+=`</div>`;
  });
  h+=PLAN.footer;
  planEl.innerHTML=h;
}
planEl.onclick=e=>{
  const g=e.target.closest("[data-go]"); if(g){e.stopPropagation();goMap(g.dataset.go);return;}
  const mb=e.target.closest("[data-mode]");
  if(mb){mode=mb.dataset.mode;localStorage.setItem(LS+"m",mode);renderPlan();return;}
  const o=e.target.closest(".opt");
  if(o){pick[o.dataset.k]=+o.dataset.o;localStorage.setItem(LS+"p",JSON.stringify(pick));renderPlan();}
};
renderPlan();

addEventListener("resize",()=>{if(S.view==="map")render();});
drawChips();drawList();render();refresh();
</script>
